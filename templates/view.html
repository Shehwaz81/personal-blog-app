{% extends 'base.html' %}
    {% block content %}
        <!--div where the markdown formated text will be inserted-->
        <div id="markdown-display" class="border border-4 border-primary p-4 m-3"></div>

        <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>
        <script>
            let text = {{raw_text | tojson}}  // we must turn text into json to avoid injection attacks with quotations
            const html_output = marked.parse(text);

            document.getElementById('markdown-display').innerHTML = html_output;
        </script>
    {% endblock %}
